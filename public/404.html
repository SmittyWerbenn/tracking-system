<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Sistem Tracking &amp; Resi Digital - Gmslogistics</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: GH Pages has no server-side
      // rewrite, so a direct load or refresh on a deep link (e.g.
      // /admin/pengiriman/baru) hits this 404 page instead of index.html.
      // This redirects back to index.html, packing the real path into a
      // query string that index.html's inline script below unpacks.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
