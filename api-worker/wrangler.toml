[vars]
ALLOWED_ORIGINS = "https://smittywerbenn.github.io,https://temp-gms.frel.cloud,http://localhost:5183"
MINIO_ENDPOINT = "https://os-api.rextop.id"
MINIO_BUCKET = "gms"
SESSION_TTL_HOURS = "24"

[[d1_databases]]
binding = "DB"
database_name = "gms-db"
database_id = "83b936b8-c728-41b4-bca0-5ef5d299b427"
